<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9c6141"><link rel="manifest" href="manifest.webmanifest"><title>Celadon CRM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3eee4;color:#332c24;font-family:Tahoma,Arial,sans-serif}.app{max-width:980px;margin:auto;padding:18px 16px 100px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e4d9c7;padding:12px 0 18px}.logo{font-weight:700;letter-spacing:3px}.logo small{color:#9c6141;font-size:10px}button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{border:1px solid #e4d9c7;background:#fff;color:#332c24;border-radius:12px;padding:9px 12px}.primary{background:#9c6141;color:#fff;border:0}.hero{padding:38px 2px 25px;border-bottom:1px solid #e4d9c7}.muted{color:#8a7d6b;font-size:13px}h1{font-size:28px;font-weight:600;margin:7px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.card,.panel,.item{background:#fff;border:1px solid #e4d9c7;border-radius:16px;padding:15px}.card b{display:block;font-size:25px;margin-top:6px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.full{grid-column:1/-1}input,select,textarea{width:100%;background:#fff;border:1px solid #e4d9c7;border-radius:11px;padding:10px;color:#332c24;outline:0}.item{margin:8px 0;display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:10px;align-items:center}.tag{background:#f3eee4;border-radius:99px;padding:4px 8px;font-size:12px}nav{position:fixed;z-index:5;bottom:12px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #e4d9c7;border-radius:17px;padding:5px;display:flex;box-shadow:0 8px 30px #332c2415}nav button{border:0;background:transparent;color:#8a7d6b;padding:9px 10px;border-radius:12px}nav .active{background:#f3eee4;color:#9c6141}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.item{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}nav button{font-size:11px;padding:9px 7px}}
</style></head><body><div class="app"><header><div class="logo">CELADON <small>CRM</small></div><div><button class="btn" onclick="backup()">پشتیبان</button><label class="btn">بازیابی<input hidden type="file" accept=".json" onchange="restore(event)"></label></div></header><div id="v"></div><nav><button onclick="go('home')" id="home">خانه</button><button onclick="go('customers')" id="customers">مشتری</button><button onclick="go('galleries')" id="galleries">گالری</button><button onclick="go('orders')" id="orders">سفارش</button><button onclick="go('products')" id="products">محصولات</button></nav></div>
<script>
const P=[["pico","پیکو","۶۹۰,۰۰۰","سفید، سبز، قهوه‌ای"],["lale","لاله یوموری","۴۳۰,۰۰۰ تکی / ۱,۷۰۰,۰۰۰ ست ۵تایی","قرمز، آبی، سبز روشن، بنفش، زرد"],["clock","ساعت سرامیکی","۱,۸۵۰,۰۰۰ سایز M / ۳,۵۰۰,۰۰۰ سایز L","مدل‌های متنوع؛ توضیح مدل"],["ash","زیرسیگاری","۷۳۰,۰۰۰","مجموعه‌های مختلف"],["salt7","نمکدون انگشتی","۲۸۵,۰۰۰ / ۱,۶۰۰,۰۰۰ دست ۷تایی","۵ رنگ توپ‌توپی و سفید"],["pebble","نمکدون قلوه‌سنگ","۲۹۵,۰۰۰","صورتی، سفید، خاکی، طوسی"],["duo","نمکدون فلفلدون دوتایی","۶۴۰,۰۰۰ هر جفت","مشکی و سفید؛ سبز و لیمویی؛ آبی کاربنی و سفید راه‌راه"]];
let db=JSON.parse(localStorage.getItem("celadon_v1")||'{"customers":[],"galleries":[],"orders":[]}');
const save=()=>localStorage.setItem("celadon_v1",JSON.stringify(db));
function go(x){document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));document.getElementById(x).classList.add("active");({home,customers,galleries,orders,products})[x]()}
function home(){v.innerHTML=`<section class=hero><span class=muted>مدیریت سلادن</span><h1>سلام، خوش آمدی.</h1><p class=muted>CRM آفلاین سلادن؛ اطلاعات روی همین دستگاه ذخیره می‌شود.</p></section><div class=stats><div class=card>مشتری‌ها<b>${db.customers.length}</b></div><div class=card>گالری‌ها<b>${db.galleries.length}</b></div><div class=card>سفارش‌ها<b>${db.orders.length}</b></div><div class=card>محصولات<b>${P.length}</b></div></div>`}
function customers(){v.innerHTML=`<h1>مشتری‌ها</h1><div class=panel><div class=form><input id=cn placeholder="نام مشتری"><input id=cp placeholder="موبایل"><input id=cc placeholder="شهر"><input id=ci placeholder="آیدی اینستاگرام"><input class=full id=ca placeholder="آدرس"><button class="btn primary full" onclick=addC()>+ ثبت مشتری</button></div></div><input id=q placeholder="جستجو..." oninput=renderC><div id=list></div>`;renderC()}
function renderC(){let q=(document.getElementById("q")?.value||"").toLowerCase();list.innerHTML=db.customers.filter(x=>(x.name+x.phone+x.ig+x.city).toLowerCase().includes(q)).map(x=>`<div class=item><b>${x.name}</b><span>${x.city||"—"}</span><span>${x.phone||"—"}</span><span class=tag>${x.ig||"بدون اینستاگرام"}</span></div>`).join("")}
function addC(){if(!cn.value.trim())return;db.customers.push({id:Date.now(),name:cn.value,phone:cp.value,city:cc.value,ig:ci.value,address:ca.value});save();customers()}
function galleries(){v.innerHTML=`<h1>گالری‌ها</h1><div class=panel><div class=form><input id=gn placeholder="نام گالری"><input id=gp placeholder="موبایل"><input id=gc placeholder="شهر"><input id=gr placeholder="درصد گالری"><select id=gs><option>امانی - تسویه ماهانه</option><option>تسویه کامل</option><option>سایر</option></select><input class=full id=ga placeholder="آدرس"><button class="btn primary full" onclick=addG()>+ ثبت گالری</button></div></div>${db.galleries.map(x=>`<div class=item><b>${x.name}</b><span>${x.city||"—"}</span><span>${x.rate||0}%</span><span class=tag>${x.settle}</span></div>`).join("")}`}
function addG(){if(!gn.value.trim())return;db.galleries.push({id:Date.now(),name:gn.value,phone:gp.value,city:gc.value,rate:gr.value,settle:gs.value,address:ga.value});save();galleries()}
function orders(){v.innerHTML=`<h1>سفارش جدید</h1><div class=panel><div class=form><select id=oc><option value="">مشتری</option>${db.customers.map(x=>`<option value=${x.id}>${x.name}</option>`)}</select><select id=og><option value="">گالری / عادی</option>${db.galleries.map(x=>`<option value=${x.id}>${x.name}</option>`)}</select><select id=op>${P.map(x=>`<option value=${x[0]}>${x[1]}</option>`)}</select><input id=ov placeholder="رنگ / سایز / توضیح مدل"><input id=oq type=number value=1 min=1><select id=os><option>پیش‌خرید</option><option>پرداخت شده</option><option>ارسال شده</option><option>مرجوع</option></select><input id=od placeholder="تاریخ شمسی"><textarea class=full id=on placeholder="توضیحات"></textarea><button class="btn primary full" onclick=addO()>+ ثبت سفارش</button></div></div>${db.orders.slice().reverse().map(x=>`<div class=item><b>${P.find(p=>p[0]==x.product)?.[1]||""}</b><span>${x.variant||"—"}</span><span>${x.qty} عدد</span><span class=tag>${x.status}</span></div>`).join("")}`}
function addO(){db.orders.push({id:Date.now(),customer:oc.value,gallery:og.value,product:op.value,variant:ov.value,qty:oq.value,status:os.value,date:od.value,note:on.value});save();orders()}
function products(){v.innerHTML="<h1>محصولات</h1>"+P.map(x=>`<div class=item><b>${x[1]}</b><span>${x[2]}</span><span class=tag>${x[3]}</span></div>`).join("")}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="celadon-backup.json";a.click()}
function restore(e){let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(x.customers&&x.galleries&&x.orders){db=x;save();go("home")}}catch{}};r.readAsText(e.target.files[0])}go("home");
</script></body></html>
