<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9c6141">
<title>Celadon CRM v4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3eee4;color:#332c24;font-family:Tahoma,Arial,sans-serif}.app{max-width:1100px;margin:auto;padding:14px 12px 70px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 15px;border-bottom:1px solid #e4d9c7}.logo{font-weight:bold;letter-spacing:3px}.logo small{color:#9c6141;font-size:9px}
.nav{display:flex;gap:5px;overflow:auto;margin:12px 0}.nav button,.btn{border:1px solid #e4d9c7;background:#fff;color:#332c24;border-radius:11px;padding:9px 12px}.nav button.active,.primary{background:#9c6141;color:#fff;border-color:#9c6141}
.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:12px}.panel{background:#fff;border:1px solid #e4d9c7;border-radius:16px;padding:15px;margin-bottom:12px}.panel h2{font-size:15px;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#f5efe4;border-radius:12px;padding:10px}.stat span{display:block;color:#8a7d6b;font-size:10px}.stat b{display:block;margin-top:4px;font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin-bottom:9px}label{display:block;color:#8a7d6b;font-size:10px;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #e4d9c7;border-radius:10px;background:#fff;color:#332c24;font:inherit}textarea{min-height:100px}.total{display:flex;justify-content:space-between;background:#332c24;color:white;border-radius:12px;padding:12px}.row{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:7px;align-items:center;padding:10px;border:1px solid #e4d9c7;border-radius:11px;margin:6px 0}.muted,.hint{color:#8a7d6b;font-size:10px;line-height:1.8}.pill{background:#f5efe4;border-radius:99px;padding:4px 8px;font-size:10px}.bar{height:8px;background:#eadfce;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#9c6141}.empty{text-align:center;color:#8a7d6b;padding:18px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#332c24;color:#fff;padding:10px 14px;border-radius:10px;opacity:0}.toast.show{opacity:1}
@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}}
@media print{button{display:none!important}.panel{border:0}}
</style></head><body><div class="app"><header><div class="logo">CELADON <small>CRM v4</small></div>
<div><button class="btn" onclick="backup()">پشتیبان</button><label class="btn">بازیابی<input hidden type=file accept=.json onchange="restore(event)"></label></div></header>
<nav class=nav><button id=n_dash onclick=show('dash')>داشبورد</button><button id=n_order onclick=show('order')>＋ سفارش</button><button id=n_gallery onclick=show('gallery')>گالری‌ها</button><button id=n_cust onclick=show('cust')>مشتری‌ها</button><button id=n_report onclick=show('report')>گزارش‌ها</button></nav><main id=main></main></div><div id=toast class=toast></div>
<script>
const P=[
["pico","پیکو",690000,["سفید","سبز","قهوه‌ای"],["تکی"],[690000]],
["lale","لاله یوموری",430000,["قرمز","آبی","سبز روشن","بنفش","زرد"],["تکی","ست ۵تایی"],[430000,1700000]],
["clock","ساعت",1850000,["مشکی","سفید","قرمز","سبز","آبی","سایر"],["M","L"],[1850000,3500000]],
["ash","زیرسیگاری",730000,["سبلان","طوفان","آسمان آبی","برف","کویر","افق سرخ","برکه"],["تکی"],[730000]],
["salt7","نمکدون انگشتی",285000,["توپ‌توپی ۱","توپ‌توپی ۲","توپ‌توپی ۳","توپ‌توپی ۴","توپ‌توپی ۵","سفید"],["تکی","دست ۷تایی"],[285000,1600000]],
["pebble","نمکدون قلوه‌سنگ",295000,["صورتی","سفید","خاکی","طوسی"],["تکی"],[295000]],
["duo","نمکدون فلفلدون دوتایی",640000,["مشکی و سفید","سبز و لیمویی","آبی کاربنی و سفید راه‌راه"],["هر جفت"],[640000]]
];
let db=JSON.parse(localStorage.getItem("celadon_v4")||'{"customers":[],"galleries":[],"orders":[],"items":[]}');
const save=()=>localStorage.setItem("celadon_v4",JSON.stringify(db)), id=()=>Date.now()+Math.random();
const money=n=>new Intl.NumberFormat("fa-IR").format(Math.round(n||0))+" تومان";
const dateFa=()=>new Intl.DateTimeFormat("fa-IR-u-ca-persian",{year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const toast=t=>{let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1500)};
function show(k){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));document.getElementById("n_"+k).classList.add("active");({dash,order,gallery,cust,report}[k])()}
function start(k){let d=new Date();d.setHours(0,0,0,0);if(k=="week"){d.setDate(d.getDate()-((d.getDay()+6)%7))}if(k=="month")d.setDate(1);return d}
function recent(k){let s=start(k);return db.orders.filter(o=>o.status!="مرجوع"&&(k=="all"||new Date(o.created)>=s))}
function dash(){
let all=db.orders.filter(o=>o.status!="مرجوع"), wk=recent("week"),mo=recent("month");
let at=db.items.filter(x=>x.status=="نزد گالری").reduce((a,x)=>a+x.qty,0), out=db.items.reduce((a,x)=>a+x.qty,0);
let map={};all.forEach(o=>map[o.product]=(map[o.product]||0)+o.qty);let top=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6);
let gm={};all.forEach(o=>gm[o.product+" — "+o.variant]=(gm[o.product+" — "+o.variant]||0)+o.qty);
main.innerHTML=`<div class=panel><div class=stats><div class=stat><span>کل کالاهای خروجی</span><b>${out}</b></div><div class=stat><span>نزد گالری‌ها</span><b>${at}</b></div><div class=stat><span>فروش این هفته</span><b>${money(wk.reduce((a,o)=>a+o.total,0))}</b></div><div class=stat><span>فروش این ماه</span><b>${money(mo.reduce((a,o)=>a+o.total,0))}</b></div></div></div>
<div class=grid><section><div class=panel><h2>پرفروش‌ترین محصولات</h2>${top.map((x,i)=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><b>${i+1}. ${x[0]}</b><span>${x[1]} عدد</span></div><div class=bar><i style="width:${Math.max(8,x[1]/top[0][1]*100)}%"></i></div></div>`).join("")||'<div class=empty>هنوز فروش ثبت نشده</div>'}</div>
<div class=panel><h2>پرفروش‌ترین رنگ / مدل</h2>${Object.entries(gm).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>`<div class=row><b>${x[0]}</b><span>${x[1]} عدد</span><span></span><span></span></div>`).join("")||'<div class=empty>داده‌ای نیست</div>'}</div></section>
<aside><div class=panel><h2>فروش دوره‌ای</h2><div class=row><b>این هفته</b><span>${wk.length} سفارش</span><span>${wk.reduce((a,o)=>a+o.qty,0)} کالا</span><b>${money(wk.reduce((a,o)=>a+o.total,0))}</b></div><div class=row><b>این ماه</b><span>${mo.length} سفارش</span><span>${mo.reduce((a,o)=>a+o.qty,0)} کالا</span><b>${money(mo.reduce((a,o)=>a+o.total,0))}</b></div></div>
<div class=panel><h2>کالاهای نزد گالری</h2>${db.galleries.map(g=>{let q=db.items.filter(x=>x.galleryId==g.id&&x.status=="نزد گالری").reduce((a,x)=>a+x.qty,0);return `<div class=row><b>${g.name}</b><span>${q} عدد</span><button class=btn onclick="gdetail(${g.id})">جزئیات</button></div>`}).join("")||'<div class=empty>گالری‌ای نیست</div>'}</div></aside></div>`}
function order(){
main.innerHTML=`<div class=grid><section><div class=panel><h2>ثبت سفارش</h2><div class=field><label>نوع سفارش</label><select id=typ onchange=otype()><option value=c>مشتری</option><option value=g>گالری</option></select></div>
<div class=field><label>Paste متن دایرکت / اطلاعات مشتری</label><textarea id=paste placeholder="متن کامل مشتری را Paste کن..."></textarea><button class=btn onclick=parse()>تشخیص اطلاعات</button></div>
<div class=two><div class=field><label>نام *</label><input id=nm></div><div class=field><label>موبایل</label><input id=ph></div><div class=field><label>Instagram</label><input id=ig></div><div class=field id=gf style=display:none><label>گالری</label><select id=gal>${db.galleries.map(g=>`<option value=${g.id}>${g.name}</option>`).join("")}</select></div></div>
<div id=go style=display:none><div class=two><div class=field><label>درصد گالری</label><input id=rate type=number value=30 min=0 max=100></div><div class=field><label>تسویه</label><select id=setl><option>نقدی / تسویه کامل</option><option>امانی / تسویه ماهانه</option></select></div></div></div></div>
<div class=panel><h2>محصول</h2><div class=two><div class=field><label>محصول</label><select id=pr onchange=change()></select></div><div class=field><label>نوع / سایز</label><select id=op onchange=calc()></select></div><div class=field><label>رنگ / مدل</label><select id=va></select></div><div class=field><label>تعداد</label><input id=qty type=number value=1 min=1 oninput=calc()></div></div><div class=field><label>توضیح مدل</label><input id=mdl placeholder="مثلاً کامل قرمز / دور سبز"></div><div class=total><span>مبلغ</span><b id=total>—</b></div></div>
<div class=panel><div class=two><div class=field><label>وضعیت</label><select id=st><option>پیش‌خرید</option><option>پرداخت شده</option><option>ارسال شده</option><option>مرجوع</option></select></div><div class=field><label>تاریخ شمسی</label><input id=dt value="${dateFa()}"></div></div><div class=field><label>توضیحات</label><textarea id=note></textarea></div><button class="btn primary" style="width:100%" onclick=saveOrder()>ثبت سفارش</button></div></section>
<aside><div class=panel><h2>آخرین سفارش‌ها</h2>${db.orders.slice(-8).reverse().map(o=>`<div class=row><b>${o.product}</b><span>${o.customer}</span><span>${o.qty} عدد</span><span class=pill>${o.type=="g"?"گالری":"مشتری"}</span></div>`).join("")||'<div class=empty>هنوز سفارشی نیست</div>'}</div></aside></div>`;
pr.innerHTML=P.map(x=>`<option value=${x[0]}>${x[1]}</option>`).join("");change();otype()}
function otype(){let g=typ.value=="g";gf.style.display=g?"block":"none";go.style.display=g?"block":"none"}
function change(){let p=P.find(x=>x[0]==pr.value);op.innerHTML=p[4].map((x,i)=>`<option value=${i}>${x}</option>`).join("");va.innerHTML=p[3].map(x=>`<option>${x}</option>`).join("");calc()}
function calc(){let p=P.find(x=>x[0]==pr.value),u=p[5][+op.value||0],n=+qty.value||1;total.textContent=money(u*n)}
function parse(){let t=paste.value||"",m=t.match(/(?:\+98|0098|98|0)?9\d{9}/),x=m?m[0]:"";if(x.startsWith("+98"))x="0"+x.slice(3);else if(x.startsWith("0098"))x="0"+x.slice(4);else if(x.startsWith("98"))x="0"+x.slice(2);ph.value=x;let a=t.match(/@[A-Za-z0-9._]{3,30}/);ig.value=a?a[0]:"";let n=t.match(/(?:نام|اسم)\s*[:：]?\s*([^\n،,]+)/i);if(n)nm.value=n[1].trim();toast("اطلاعات تشخیص داده شد")}
function saveOrder(){
if(!nm.value.trim()&&typ.value=="c")return toast("نام لازم است");let type=typ.value,g=type=="g"?db.galleries.find(x=>x.id==+gal.value):null;if(type=="g"&&!g)return toast("اول گالری را ثبت کن");
let p=P.find(x=>x[0]==pr.value),u=p[5][+op.value||0],n=+qty.value||1,raw=u*n;
let customer=db.customers.find(x=>(ph.value&&x.phone==ph.value)||(ig.value&&x.ig==ig.value));if(type=="c"&&!customer){customer={id:id(),name:nm.value,phone:ph.value,ig:ig.value};db.customers.push(customer)}
let old=customer&&db.orders.some(o=>o.customerId==customer.id&&o.type=="c"&&o.status!="مرجوع"),disc=old?0.1:0,total=raw*(1-disc);
let oid=id(),o={id:oid,type,customerId:customer?.id,galleryId:g?.id,customer:type=="g"?g.name:nm.value,product:p[1],option:p[4][+op.value||0],variant:va.value,model:mdl.value,qty:n,unit:u,raw,total,discount:disc,rate:type=="g"?+(rate.value||0):0,settle:type=="g"?setl.value:"",status:st.value,date:dt.value,created:new Date().toISOString(),note:note.value};
db.orders.push(o);
if(type=="g")db.items.push({id:id(),orderId:oid,galleryId:g.id,product:p[1],variant:va.value,model:mdl.value,qty:n,status:setl.value.startsWith("امانی")?"نزد گالری":"فروخته شده"});
save();toast("سفارش ثبت شد");type=="g"?setTimeout(()=>invoice(oid),300):setTimeout(order,300)
}
function gallery(){main.innerHTML=`<div class=panel><h2>ثبت گالری</h2><div class=two><div class=field><label>نام گالری</label><input id=gn></div><div class=field><label>موبایل</label><input id=gp></div><div class=field><label>شهر</label><input id=gc></div></div><button class="btn primary" onclick=addg()>ثبت گالری</button></div><div class=panel><h2>گالری‌ها</h2>${db.galleries.map(g=>`<div class=row><b>${g.name}</b><span>${g.city||"—"}</span><span>${db.items.filter(x=>x.galleryId==g.id&&x.status=="نزد گالری").reduce((a,x)=>a+x.qty,0)} نزد گالری</span><button class=btn onclick="gdetail(${g.id})">جزئیات</button></div>`).join("")||'<div class=empty>گالری‌ای ثبت نشده</div>'}</div>`}
function addg(){if(!gn.value.trim())return toast("نام گالری لازم است");db.galleries.push({id:id(),name:gn.value,phone:gp.value,city:gc.value});save();toast("گالری ثبت شد");gallery()}
function gdetail(gid){let g=db.galleries.find(x=>x.id==gid),a=db.items.filter(x=>x.galleryId==gid),at=a.filter(x=>x.status=="نزد گالری"),sold=a.filter(x=>x.status=="فروخته شده");main.innerHTML=`<div class=panel><button class=btn onclick=gallery()>← بازگشت</button><h2>${g.name}</h2><div class=stats><div class=stat><span>نزد گالری</span><b>${at.reduce((s,x)=>s+x.qty,0)}</b></div><div class=stat><span>فروخته‌شده</span><b>${sold.reduce((s,x)=>s+x.qty,0)}</b></div><div class=stat><span>کل خروجی</span><b>${a.reduce((s,x)=>s+x.qty,0)}</b></div><div class=stat><span>آیتم‌ها</span><b>${a.length}</b></div></div></div><div class=panel><h2>اقلام</h2>${a.map(x=>`<div class=row><b>${x.product}</b><span>${x.variant}</span><span>${x.qty} عدد</span><span class=pill>${x.status}</span></div>`).join("")}</div><div class=panel><h2>اعلام فروش گالری</h2><div class=two><div class=field><label>کالا</label><select id=si>${at.map(x=>`<option value=${x.id}>${x.product} - ${x.variant} (${x.qty})</option>`).join("")}</select></div><div class=field><label>تعداد</label><input id=sn type=number value=1 min=1></div></div><button class="btn primary" onclick=solditem(${gid})>ثبت فروش</button></div>`}
function solditem(gid){let x=db.items.find(x=>x.id==+si.value),n=+sn.value;if(!x||n<1)return;if(n>=x.qty)x.status="فروخته شده";else{x.qty-=n;db.items.push({...x,id:id(),qty:n,status:"فروخته شده"})}save();toast("فروش گالری ثبت شد");gdetail(gid)}
function cust(){main.innerHTML=`<div class=panel><h2>مشتری‌ها</h2><input id=cq placeholder="جستجو..." oninput=rcust()><div id=cl></div></div>`;rcust()}
function rcust(){let q=(cq.value||"").toLowerCase();cl.innerHTML=db.customers.filter(c=>(c.name+c.phone+c.ig).toLowerCase().includes(q)).map(c=>`<div class=row><b>${c.name}</b><span>${c.phone||"—"}</span><span>${c.ig||"—"}</span><span>${db.orders.filter(o=>o.customerId==c.id).length} خرید</span></div>`).join("")||'<div class=empty>موردی نیست</div>'}
function report(){main.innerHTML=`<div class=panel><h2>گزارش فروش</h2><div class=two><div class=field><label>بازه</label><select id=rp onchange=rreport()><option value=week>این هفته</option><option value=month>این ماه</option><option value=all>کل</option></select></div><div class=field><label>نوع</label><select id=rt onchange=rreport()><option value=all>همه</option><option value=c>مشتری</option><option value=g>گالری</option></select></div></div><div id=rr></div></div>`;rreport()}
function rreport(){let a=recent(rp.value).filter(o=>rt.value=="all"||o.type==rt.value),m={};a.forEach(o=>m[o.product]=(m[o.product]||0)+o.qty);rr.innerHTML=`<div class=stats><div class=stat><span>سفارش</span><b>${a.length}</b></div><div class=stat><span>کالا</span><b>${a.reduce((s,o)=>s+o.qty,0)}</b></div><div class=stat><span>فروش</span><b>${money(a.reduce((s,o)=>s+o.total,0))}</b></div><div class=stat><span>گالری</span><b>${a.filter(o=>o.type=="g").length}</b></div></div><h2 style="margin-top:18px">پرفروش‌ترین‌ها</h2>${Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>`<div class=row><b>${x[0]}</b><span>${x[1]} عدد</span><span></span><span></span></div>`).join("")||'<div class=empty>داده‌ای نیست</div>'}`}
function invoice(oid){let o=db.orders.find(x=>x.id==oid),g=db.galleries.find(x=>x.id==o.galleryId),comm=o.raw*o.rate/100,net=o.raw-comm;main.innerHTML=`<div class=panel" id=invoice><div style="display:flex;justify-content:space-between"><div><b style="font-size:20px">سلادن</b><br><span class=muted>فاکتور گالری</span></div><div>شماره: ${String(o.id).slice(-7)}<br>تاریخ: ${o.date}</div></div><hr><p><b>گالری:</b> ${g.name}</p><table style="width:100%;border-collapse:collapse"><tr><th>محصول</th><th>رنگ/مدل</th><th>تعداد</th><th>قیمت واحد</th><th>مبلغ</th></tr><tr><td>${o.product} ${o.option}</td><td>${o.variant} ${o.model||""}</td><td>${o.qty}</td><td>${money(o.unit)}</td><td>${money(o.raw)}</td></tr></table><p>درصد گالری: ${o.rate}%</p><p>سهم گالری: ${money(comm)}</p><h3>مبلغ قابل تسویه سلادن: ${money(net)}</h3><p>نوع تسویه: ${o.settle}</p></div><button class="btn primary" onclick=window.print()>چاپ / ذخیره PDF</button> <button class=btn onclick=show('dash')>بازگشت</button>`}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="celadon-v4-backup.json";a.click()}
function restore(e){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();toast("بازیابی شد");dash()}catch{toast("فایل نامعتبر است")}};r.readAsText(e.target.files[0])}
show("dash");
</script></body></html>
